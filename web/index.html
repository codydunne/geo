<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Every path under /geo/ serves this page, so assets must resolve from /geo/. -->
  <base href="/geo/">
  <title>geo · open a location in any map</title>
  <meta name="description" content="Open a coordinate or map link in any of hundreds of map services.">
  <link rel="icon" href="_/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="_/leaflet/leaflet.css">
  <link rel="stylesheet" href="_/style.css">
  <script src="_/leaflet/leaflet.js" defer></script>
  <script type="module" src="_/app.js"></script>
</head>
<body>
  <div class="container">
    <h1><a href="./">geo</a></h1>
    <p class="subtitle" id="where">Open a location in any map.</p>
    <div class="layout">
      <div class="left">
        <form id="go">
          <div class="clearable">
            <input type="text" id="q" aria-label="Coordinates, map URL, or address"
                   placeholder="Coordinates, map URL, or address" autocomplete="off" enterkeyhint="go">
            <button type="button" id="q-clear" aria-label="Clear location" hidden>&times;</button>
          </div>
          <button type="submit">Go</button>
        </form>
        <div class="actions">
          <button type="button" class="secondary" id="copy">Copy link</button>
          <button type="button" class="secondary" id="share" hidden>Share</button>
          <button type="button" class="secondary" id="locate">My location</button>
        </div>
        <p id="msg" class="message" role="status" hidden></p>
        <div id="map" role="region" aria-label="Map of the location; drag the pin to move it"></div>
        <div id="pane" hidden>
          <div class="panebar">
            <strong id="pane-name"></strong>
            <a id="pane-open" class="button" target="_blank" rel="noopener">Open ↗</a>
            <button type="button" class="secondary" id="pane-wide" aria-pressed="false">Expand</button>
            <button type="button" class="secondary" id="pane-close">Back to pin</button>
          </div>
        </div>
      </div>
      <div class="right">
        <div id="featured" class="featured" hidden></div>
        <div class="clearable">
          <input type="search" id="filter" aria-label="Filter maps" placeholder="Filter maps by name or category">
          <button type="button" id="filter-clear" aria-label="Clear filter" hidden>&times;</button>
        </div>
        <div id="list"></div>
        <div class="toggles">
          <label><input type="checkbox" id="show-disabled"> Show disabled</label>
          <label><input type="checkbox" id="show-regions"> Show other regions</label>
          <label><input type="checkbox" id="frame-any"> Try any map in the frame</label>
        </div>
        <footer>
          Credits: Map links collected from
          <a href="https://geohack.toolforge.org/">GeoHack</a> (<a href="https://en.wikipedia.org/wiki/Template:GeoTemplate">Template:GeoTemplate</a>, CC BY-SA 4.0) and
          <a href="https://github.com/tankaru/OpenSwitchMapsWeb">OpenSwitchMaps</a> (MIT).
          Geocoding by <a href="https://nominatim.org/">Nominatim</a> and <a href="https://photon.komoot.io/">Photon</a>.
          Region outlines from <a href="https://www.naturalearthdata.com/">Natural Earth</a>.
          Map by <a href="https://leafletjs.com/">Leaflet</a> with
          <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> tiles.
        </footer>
      </div>
    </div>
  </div>
</body>
</html>
