# Publish web/ as-is to GitHub Pages
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
# Switching source deploys nothing by itself: the old branch build stays
# live until this workflow runs (a push touching web/ or this file).
name: Deploy web viewer to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Fallback routing if the Cloudflare rewrite is ever removed: GitHub Pages
      # serves 404.html for unknown paths, and the page parses the URL itself.
      - run: cp web/index.html web/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
